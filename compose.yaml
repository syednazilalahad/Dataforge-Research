services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: researchforge
      POSTGRES_USER: researchforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - researchforge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchforge -d researchforge"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://researchforge:${POSTGRES_PASSWORD}@postgres:5432/researchforge
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-offline}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  researchforge-db:
